{{- /*
A LimitRange (Container defaults and bounds) per listed namespace, opt-in.
A reason or an owner is required (schema and render) and recorded as an
annotation. Prunable unless protected (limitRange.protect or the entry's
`protect`).
*/ -}}
{{- $l := .Values.limitRange -}}
{{- range $ns := keys ($l.namespaces | default dict) | sortAlpha }}
{{- $e := index $l.namespaces $ns }}
{{- if not (or $e.reason $e.owner) }}{{- fail (printf "limitRange.namespaces.%s needs a reason or an owner" $ns) }}{{- end }}
{{- $extra := dict }}
{{- if $e.reason }}{{- $_ := set $extra $l.reasonAnnotation $e.reason }}{{- end }}
{{- if $e.owner }}{{- $_ := set $extra $l.ownerAnnotation $e.owner }}{{- end }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ $e.name | default $l.name }}
  namespace: {{ $ns }}
  {{- with include "cluster-baseline.annotations" (dict "protect" (ternary $e.protect $l.protect (hasKey $e "protect")) "extra" $extra) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  limits:
    - type: Container
      {{- range $f := list "default" "defaultRequest" "max" "min" }}
      {{- with index $e.container $f }}
      {{- $m := . }}
      {{ $f }}:
        {{- range $k := keys $m | sortAlpha }}
        {{ $k | quote }}: {{ include "cluster-baseline.quantity" (index $m $k) | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
