{{- /*
A default-deny NetworkPolicy per listed namespace, opt-in. The DNS decision is
required by the schema whenever egress is denied. Protected by default
(networkPolicy.protect, or the entry's own `protect`). An entry may let
traffic through: `intraNamespace` (the namespace's own pods, each denied
direction) and `ingress`/`egress` rules, NetworkPolicy rules verbatim with a
`description`, only for a direction it denies.
*/ -}}
{{- $np := .Values.networkPolicy -}}
{{- range $ns := keys ($np.namespaces | default dict) | sortAlpha }}
{{- $e := index $np.namespaces $ns }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $e.name | default $np.name }}
  namespace: {{ $ns }}
  {{- with include "cluster-baseline.annotations" (dict "protect" (ternary $e.protect $np.protect (hasKey $e "protect")) "extra" dict) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  podSelector: {}
  policyTypes:
    {{- range $t := sortAlpha $e.deny }}
    - {{ title $t }}
    {{- end }}
  {{- range $dir := list "ingress" "egress" }}
  {{- $rules := index $e $dir | default list }}
  {{- if and $rules (not (has $dir $e.deny)) }}
  {{- fail (printf "networkPolicy.namespaces.%s.%s: allow rules for a direction the policy does not deny" $ns $dir) }}
  {{- end }}
  {{- $intra := and $e.intraNamespace (has $dir $e.deny) }}
  {{- $dns := and (eq $dir "egress") (has "egress" $e.deny) $e.dnsEgress }}
  {{- if or $rules $intra $dns }}
  {{ $dir }}:
    {{- if $intra }}
    # intraNamespace: the namespace's own pods
    - {{ ternary "from" "to" (eq $dir "ingress") }}:
        - podSelector: {}
    {{- end }}
    {{- if $dns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespace }}
          podSelector:
            matchLabels:
              {{ $np.dns.podLabelKey }}: {{ $np.dns.podLabelValue | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range $r := $rules }}
    # {{ required (printf "networkPolicy.namespaces.%s.%s: every rule needs a description" $ns $dir) $r.description }}
    - {{ toYaml (omit $r "description") | indent 6 | trim }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
