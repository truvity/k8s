# Nothing here names an estate: the list of namespaces is the caller's.
# The defaults are the warn-first posture: every listed namespace is
# WARNED and AUDITED at `restricted`, and nothing is enforced.
podSecurity:
  # The level every mode that is on uses, unless a namespace or a mode
  # overrides it. One of privileged, baseline, restricted.
  level: restricted

  # Pin the Pod Security Standards version for every mode, "latest" or a
  # Kubernetes minor such as "v1.34". Empty renders no *-version label, which
  # the API server reads as latest. Pin before enforcing: with "latest" an
  # upgrade of the cluster can tighten what an enforced namespace admits.
  version: ""

  # One switch per label kind. `enabled: false` renders no label of that
  # kind (for a namespace that does not override it). `level` and `version`
  # here replace the two values above for this one mode; empty inherits.
  modes:
    warn:
      enabled: true
      level: ""
      version: ""
    audit:
      enabled: true
      level: ""
      version: ""
    enforce:
      enabled: false
      level: ""
      version: ""

  # The namespaces this chart labels, by name. An empty entry takes the
  # defaults above:
  #
  #   namespaces:
  #     team-a: {}
  #     node-agents:
  #       level: privileged
  #       reason: "runs host-level agents; cannot meet baseline"
  #     batch-runner:
  #       reason: "enforce canary while the rest of the cluster only warns"
  #       modes:
  #         enforce: { level: restricted }
  #
  # `level` replaces the default level for every mode that is on in this
  # namespace. `modes.<kind>` overrides one kind and renders its label even
  # when that kind is switched off cluster-wide, which is how enforcement is
  # rolled out one namespace at a time. Any override of the resolved level
  # must carry a `reason`: the render refuses one that does not.
  # `modes.<kind>.enabled: false` does the opposite for one namespace: no
  # label of that kind although the kind is on cluster-wide (a warn-first
  # namespace on an enforcing cluster); it needs a `reason` too.
  namespaces: {}

# Labels-only Namespace objects are meant to be applied server-side, so they
# own exactly their labels and annotations. A pruning or uninstalling tool
# would otherwise delete the namespace, and everything in it, when a name
# leaves the list. With protection on, each object says not to: Helm keeps
# it (resource-policy keep) and Argo CD neither prunes nor deletes it.
protect: true

# The annotation that carries a namespace's exemption reason, so the reason
# is visible with `kubectl get ns -o yaml` and not only in git.
reasonAnnotation: cluster-baseline/psa-reason

# --- The guard ---------------------------------------------------------------
# The labels above only cover the namespaces listed. The guard closes the gap:
# a ValidatingAdmissionPolicy (Kubernetes 1.30+) that WARNS and AUDITS when a
# Namespace is created without a Pod Security label, or updated to drop the
# labels it had. It never mutates, so it cannot fight a namespace's owner.
# Off by default, like every part below: installing the chart changes nothing
# until something is switched on.
guard:
  enabled: false
  name: cluster-baseline-pod-security-labels
  # Warn and Audit by default. Add Deny only after the warnings have been
  # quiet for a while: Deny refuses every tool that creates a namespace
  # without the labels.
  validationActions: [Warn, Audit]
  # Ignore: if the policy machinery is unavailable, namespaces are still
  # admitted. A warning guard must never be able to block a namespace.
  failurePolicy: Ignore
  # A namespace satisfies the guard with ANY of these label kinds.
  satisfiedBy: [warn, audit, enforce]
  # Namespaces the guard never looks at: the ones the control plane creates.
  # Extend the list for namespaces whose owner you do not control.
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - default
  # Namespaces whose NAME starts with one of these are skipped too (for
  # short-lived, tool-generated namespaces). Empty by default.
  excludeNamePrefixes: []
  # Restrict the guard to namespaces whose own labels match (a standard label
  # selector). Empty matches every namespace.
  namespaceSelector: {}

# The label guard: a ValidatingAdmissionPolicy that lets only the named
# principals set, change or remove the namespace labels the platform owns.
# Engines that select namespaces by label read them, so whoever writes them
# widens what a namespace gets. Off by default.
labelGuard:
  enabled: false
  name: cluster-baseline-namespace-labels
  # Warn and Audit first; Deny once the audit log shows only the expected
  # principals.
  validationActions: [Warn, Audit]
  # Ignore: a warning guard must never block a namespace. Use Fail together
  # with Deny.
  failurePolicy: Ignore
  # Label keys starting with one of these are protected.
  protectedPrefixes:
    - pod-security.kubernetes.io/
  # Label keys whose prefix is one of these DNS domains, or a subdomain of
  # one (example.com protects example.com/x and team.example.com/x).
  protectedDomains: []
  # The principals the guard does not look at: exact user names, user name
  # prefixes (an assumed role's session names vary) and groups. Name at least
  # one, or nobody could label a namespace.
  allowedUsers: []
  allowedUserPrefixes: []
  allowedGroups: []

# --- Opt-in per namespace ----------------------------------------------------
# Each block below renders nothing until a namespace is listed under it. The
# namespaces must already exist: these objects are namespaced and do not
# create them. Each kind decides below whether it is protected from pruning,
# and why.

# A default-deny NetworkPolicy. NetworkPolicy is additive: a second deny-all
# policy changes nothing today, but the day the real owner narrows theirs this
# one still denies. So do NOT list a namespace that already has a deny policy
# from another owner; leave that namespace to its owner. A different `name`
# (here or per namespace) avoids a server-side apply conflict, not the
# duplication.
networkPolicy:
  name: cluster-baseline-default-deny
  # Removing a deny policy opens traffic, and an accidental prune is the one
  # failure here that is silent, so this is the only extra protected by
  # default: Helm keeps it, Argo CD neither prunes nor deletes it. Hand a
  # namespace to its owner by setting `protect: false` on its entry first
  # (or here), then removing it from the list. Each entry may override.
  protect: true
  # Where cluster DNS runs, for the DNS allow rule.
  dns:
    namespace: kube-system
    # The label that selects the DNS pods, one key and one value (a map would
    # merge with this default instead of replacing it).
    podLabelKey: k8s-app
    podLabelValue: kube-dns
  # Namespaces, by name:
  #
  #   namespaces:
  #     team-a:
  #       deny: [ingress, egress]
  #       dnsEgress: true          # REQUIRED when egress is denied
  #       protect: false           # optional per-entry override
  #     batch:
  #       deny: [ingress]
  #     shop:
  #       deny: [ingress, egress]
  #       dnsEgress: true
  #       intraNamespace: true       # the namespace's own pods, both ways
  #       ingress:                   # NetworkPolicy rules verbatim, plus a
  #         - description: the gateway   # `description` (required)
  #           from:
  #             - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateway}}
  #       egress:
  #         - description: HTTPS out
  #           to: [{ipBlock: {cidr: 0.0.0.0/0}}]
  #           ports: [{port: 443, protocol: TCP}]
  #
  # `dnsEgress` is a decision the render demands whenever egress is denied: a
  # plain egress deny-all breaks name resolution. true allows DNS (port 53,
  # UDP and TCP) to the cluster DNS above and nothing else; false is a
  # deliberate total egress deny. It is refused on an ingress-only entry.
  namespaces: {}

# A ResourceQuota. Values-driven: the chart ships no numbers, because any
# default could block a workload. Every entry needs `hard` and a `reason` or an
# `owner` (the render refuses one with neither), recorded as an annotation.
resourceQuota:
  name: cluster-baseline
  # Removing a quota only relaxes a limit: prunable by default.
  protect: false
  reasonAnnotation: cluster-baseline/quota-reason
  ownerAnnotation: cluster-baseline/quota-owner
  #   namespaces:
  #     team-a:
  #       reason: "caps a runaway batch job from starving the node pool"
  #       hard:
  #         pods: 50
  #         requests.cpu: "20"
  #         requests.memory: 64Gi
  namespaces: {}

# A LimitRange for Container defaults and bounds. Opt-in and values-driven; no
# defaults. Every entry needs a `reason` or an `owner` (the render refuses one
# with neither), recorded as an annotation, because a default memory limit is
# a decision someone must be able to find and revisit. `default` is the LIMIT a container without one receives and
# `defaultRequest` its REQUEST; a limit without a request makes the request
# equal to the limit. A default memory limit can OOM-kill an unsized workload.
limitRange:
  name: cluster-baseline
  # Removing it stops adding defaults to NEW pods only; existing pods keep
  # what they were given. Prunable by default. Protect it if a quota in the
  # same namespace requires requests, so removal cannot leave pods
  # unschedulable.
  protect: false
  reasonAnnotation: cluster-baseline/limit-range-reason
  ownerAnnotation: cluster-baseline/limit-range-owner
  #   namespaces:
  #     team-a:
  #       reason: "pods without sizing get a bounded default"
  #       container:
  #         defaultRequest: { cpu: 100m, memory: 128Mi }
  #         default: { memory: 512Mi }
  namespaces: {}

# RBAC, opt-in. Per namespace: Roles, and RoleBindings to a ClusterRole or a
# Role of the same namespace. Cluster-wide: ClusterRoles, typically rights on
# operator CRDs, with `aggregateTo` to add them to built-in roles (admin, edit,
# view). Not protected by default: removing a binding only takes a right away.
#
#   rbac:
#     clusterRoles:
#       team-crds:
#         aggregateTo: [admin]
#         rules:
#           - {apiGroups: [example.com], resources: [widgets], verbs: [get, list, watch, create, update, patch, delete]}
#     namespaces:
#       team-a:
#         roles:
#           read-certs:
#             rules:
#               - {apiGroups: [cert-manager.io], resources: [certificaterequests], verbs: [create]}
#         roleBindings:
#           deployers:
#             clusterRole: edit
#             subjects: [{kind: Group, name: "team-a:deployer"}]
#           certs:
#             role: read-certs
#             subjects: [{kind: Group, name: "system:serviceaccounts:team-a"}]
rbac:
  protect: false
  clusterRoles: {}
  namespaces: {}

# ACK IAMRoleSelectors, opt-in: one per namespace, <namePrefix><namespace>,
# binding an IAM role to the namespace by name, so the ACK controllers
# reconcile its AWS resources with that role (its capability ceiling).
# Protected by default: removing one widens what those resources run as.
#
#   ackRoleSelectors:
#     namePrefix: ack-project-
#     namespaces:
#       team-a: {roleARN: "<the IAM role ARN>"}
ackRoleSelectors:
  namePrefix: ""
  protect: true
  namespaces: {}
