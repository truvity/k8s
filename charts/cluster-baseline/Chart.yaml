apiVersion: v2
name: cluster-baseline
description: >-
  The security baseline every namespace of a cluster is held to, as data.
  Pod Security Admission: the labels that set each namespace's warn, audit and
  enforce level, with a default level, a per-namespace override that must carry
  a reason, and a warn-first rollout; a guard that warns when a namespace is
  created without them. Opt-in per namespace, off until listed: a default-deny
  NetworkPolicy, a ResourceQuota and a LimitRange. Cluster-agnostic: nothing
  provider-specific.
type: application
