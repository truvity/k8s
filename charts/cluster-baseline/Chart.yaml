apiVersion: v2
name: cluster-baseline
description: >-
  The security baseline every namespace of a cluster is held to, as data.
  The first (and so far only) part is Pod Security Admission: the labels that
  set each namespace's warn, audit and enforce level, with a default level, a
  per-namespace override that must carry a reason, and a warn-first rollout.
  Cluster-agnostic: it asks nothing of the provider, because the labels are the
  one mechanism every conformant cluster supports.
type: application
