apiVersion: v2
name: tenancy
description: >-
  The per-tenant plumbing of a shared cluster, as data. For each tenant
  namespace: the Namespace itself with its Pod Security labels (level, version and
  modes per profile or tenant; a warn-first rollout must say so), a baseline
  NetworkPolicy, a ResourceQuota and LimitRange, RoleBindings and namespaced
  Roles, a NATS account (the NACK ServiceAccount, its token Secret and the
  Account), and EKS Pod Identity ServiceAccounts with their associations;
  plus the ClusterRoles that give tenants rights on operator CRDs. Tenants
  share a profile (tier) that carries the policy, quota and labels; every
  name, label, role and CIDR is a value, and nothing here belongs to an estate.
type: application
# Placeholder: the git tag is the sole version authority. The release
# workflow stamps both fields from the tag (truvity/ci-workflows
# release-public.yaml).
version: 0.0.0
