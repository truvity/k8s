apiVersion: v2
name: local-volumes
description: >-
  Local PersistentVolumes as data, for workloads that replicate their own
  data (databases, queues): a no-provisioner StorageClass per tier and one
  PersistentVolume per disk directory, pinned to its node and optionally to
  the claim that owns it. Paths must live under the node's user volumes
  (/var/mnt on Talos), so a missing mount fails the pod instead of filling
  the system disk. Nothing here belongs to an estate.
type: application
