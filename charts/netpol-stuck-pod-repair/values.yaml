# netpol-stuck-pod-repair: a TEMPORARY WORKAROUND.
#
# The EKS network policy agent can lose a race between a pod's CNI ADD and
# the reconcile of its PolicyEndpoint, leaving the pod Running with an empty
# eBPF egress map: every egress connection times out while the
# PolicyEndpoints are correct. Deleting the pod fixes it.
#   issue: https://github.com/aws/aws-network-policy-agent/issues/676
#   fix:   https://github.com/aws/aws-network-policy-agent/pull/705
# REMOVAL: uninstall when the node image (EKS Auto Mode: the AMI) ships an
# agent release containing #705; verify with a node drift roll followed by
# two weeks with zero repairs (netpol_repair_actions_total{mode="act"}).
#
# The selection rules and limits are documented in the repository README,
# section netpol-stuck-pod-repair. Nothing here names an estate.

image:
  repository: ghcr.io/truvity/k8s/netpol-stuck-pod-repair
  # Empty: the chart's appVersion (the release that published both).
  tag: ""
  pullPolicy: IfNotPresent

# report: log, count (mode="report") and record an Event for what WOULD be
# deleted; delete nothing. act: delete, within the limits below. Start every
# cluster in report and read what it reports before switching.
mode: report

# How often the cluster is examined.
interval: 1m

# A candidate restarted `restartThreshold` times within `restartWindow`, OR
# has been Running and NotReady for `notReadyAfter`.
restartThreshold: 3
restartWindow: 15m
notReadyAfter: 10m
# The only pod of its owner is a candidate only after it has been stuck this
# long (otherwise a candidate needs at least one other Ready replica).
singleReplicaStuckAfter: 10m

# Safety limits. No second repair of one owner within `ownerCooldown`; at
# most one deletion per `minDeleteInterval`, cluster-wide; once `maxRepairs`
# deletions fall within `haltWindow` and another candidate turns up, acting
# stops (reporting goes on, netpol_repair_halted is 1) until the pod restarts.
ownerCooldown: 30m
minDeleteInterval: 1m
maxRepairs: 5
haltWindow: 1h

# Namespaces considered: all with a NetworkPolicy when `namespaces` is empty.
# `excludeNamespaces` are never considered.
namespaces: []
excludeNamespaces:
  - kube-system

# maxNodeAge: only pods on nodes younger than this ("0s": off). Off because
# the race also hits same-node replacements on old nodes.
maxNodeAge: 0s
# The race's signature, REQUIRED of every candidate (not switchable) together
# with a PolicyEndpoint that selects the pod: its last termination message or
# recent log (the previous container's, after a restart) must contain one of
# `timeoutPatterns`. A pod that fails either is logged as "skipped: not the
# race" and never deleted. At least one pattern is needed.
timeoutPatterns:
  - "i/o timeout"
  - "connect: connection timed out"
# Log lines read per container when looking for the patterns; 0: messages only.
logTailLines: 100

# EKS Auto Mode only: before a repair (or a report), create a NodeDiagnostic
# (eks.amazonaws.com/v1alpha1, cluster-scoped, named after the node) so the
# node packages its logs, the network policy agent's among them. `destination`
# is "node" (kept on the node for later collection) or a presigned S3 URL.
# One object per node; an existing one is left alone, and none is deleted:
# remove them after collecting. Off by default.
nodeDiagnostic:
  enabled: false
  destination: node

logLevel: info

# A monitoring.coreos.com/v1 PodMonitor for /metrics (port 8080). The series
# carry the TARGET pod's `namespace`, so the endpoint honours labels. Set
# false on a cluster without the PodMonitor API.
podMonitor:
  enabled: true
  interval: ""
  labels: {}

# NetworkPolicy for this controller's own pod, for a namespace that denies by
# default. Off unless enabled. When on: egress to the Kubernetes API on
# `apiServer.ports` to the `apiServer.peers` (on EKS: the control plane's
# addresses, e.g. the VPC CIDR as an ipBlock), and ingress on 8080 from the
# `metrics` peers (the scraper). Nothing else; no DNS is needed (the API
# address comes from the pod's environment).
networkPolicy:
  enabled: false
  apiServer:
    peers: []
    ports: [443]
  metrics: []

serviceAccount:
  # Empty: the release name.
  name: ""

priorityClassName: ""
resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

# Pod Security restricted by default.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}
imagePullSecrets: []
