{{- /* honorLabels: the series carry the TARGET pod's `namespace`, which must
win over this controller's own namespace. Needs the monitoring.coreos.com/v1
PodMonitor API (prometheus-operator, or the VictoriaMetrics operator's
converter); set podMonitor.enabled false without it. */}}
{{- if .Values.podMonitor.enabled }}
{{- include "netpol-stuck-pod-repair.check" . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "netpol-stuck-pod-repair.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netpol-stuck-pod-repair.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "netpol-stuck-pod-repair.selector" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
      {{- with .Values.podMonitor.interval }}
      interval: {{ . | quote }}
      {{- end }}
{{- end }}
