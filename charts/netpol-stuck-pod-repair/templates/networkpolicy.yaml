{{- if .Values.networkPolicy.enabled }}
{{- include "netpol-stuck-pod-repair.check" . }}
{{- $np := .Values.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "netpol-stuck-pod-repair.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netpol-stuck-pod-repair.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "netpol-stuck-pod-repair.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        {{- toYaml $np.apiServer.peers | nindent 8 }}
      ports:
        {{- range $np.apiServer.ports }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
  {{- with $np.metrics }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: 8080, protocol: TCP}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
