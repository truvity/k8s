apiVersion: v2
name: netpol-stuck-pod-repair
description: >-
  TEMPORARY WORKAROUND for the EKS network policy agent race
  (aws/aws-network-policy-agent#676, fix #705 not yet released) that leaves a
  pod Running with an empty eBPF egress map. One small controller per cluster
  finds Deployment pods that restart or stay NotReady in namespaces with a
  NetworkPolicy, records evidence and deletes them, within strict limits.
  Report-only by default. Uninstall once the node image ships an agent
  release containing #705.
type: application
# Placeholder: the git tag is the sole version authority. The release
# workflow stamps both fields from the tag (truvity/ci-workflows
# release-public.yaml). image.tag defaults to appVersion.
version: 0.0.0
appVersion: 0.0.0
home: https://github.com/truvity/k8s
sources:
  - https://github.com/truvity/k8s
  - https://github.com/aws/aws-network-policy-agent/issues/676
  - https://github.com/aws/aws-network-policy-agent/pull/705
keywords:
  - eks
  - network-policy
  - workaround
maintainers:
  - name: Truvity
    url: https://github.com/truvity
