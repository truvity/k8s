apiVersion: v2
name: cluster-network-policies
description: >-
  A cluster's own NetworkPolicies, as data: the policies that contain its
  platform workloads, one per entry, each with a reason. The chart renders the
  shape (selector, policy types, rules, sync wave, deletion protection) and
  refuses a policy that does not say why it exists; what a policy admits is the
  caller's. Nothing here belongs to an estate.
type: application
