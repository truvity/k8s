# Nothing here names an estate. The list is empty: a cluster says which
# policies it wants, and why.

# Default for every policy; an entry may override it with its own `protect`.
# On, a policy carries
#   argocd.argoproj.io/sync-options: Prune=false,Delete=false
# so Argo CD neither prunes it when it leaves a render nor deletes it with its
# Application. Off (the default) renders no annotation of that kind: a
# NetworkPolicy is cheap to put back, and a stale one is the hazard.
protect: false
# Also render helm.sh/resource-policy: keep on protected policies.
helmKeep: false

# One entry per NetworkPolicy. Each entry:
#
#   name:        the object's name (required)
#   namespace:   the object's namespace (required)
#   reason:      why the policy exists (required, not rendered): a policy is a
#                decision, and the next reader should not have to guess it
#   podSelector: a label selector (matchLabels, matchExpressions); {} selects
#                every pod of the namespace (required)
#   policyTypes: Ingress, Egress, or both (required). A type listed with no
#                rules for it denies that direction for the selected pods.
#   ingress:     the ingress rules, verbatim (optional)
#   egress:      the egress rules, verbatim (optional)
#   syncWave:    argocd.argoproj.io/sync-wave (optional)
#   protect:     overrides the chart's `protect` (optional)
#   annotations: literal annotations (optional; may not set a key the chart
#                computes)
#
# THE FIRST POLICY THAT SELECTS A POD DENIES EVERYTHING THE POLICY DOES NOT
# ALLOW, in each direction it lists. Adding the first policy to a namespace
# that had none turns that namespace's selected pods default-deny. Check what a
# namespace already has before adding to it.
policies: []

# Presets: common policies rendered from a few facts, after `policies` and
# held to the same rules (no name twice, the chart's `protect`).
presets:
  # metrics-server's egress: every kubelet on 10250 and the API server on 443
  # over the node and service ranges, and DNS. Ingress (the API server's calls
  # into it) is not selected, so it stays unrestricted.
  metricsServer:
    enabled: false
    name: metrics-server
    namespace: metrics-server
    reason: "Scrapes every kubelet on 10250 and reaches the API server and the cluster resolver; ingress, the API server's calls into it, stays unrestricted."
    podSelector:
      matchLabels:
        app.kubernetes.io/name: metrics-server
    # The node range (the VPC on EKS): the kubelets and the API endpoint.
    # Required when enabled.
    nodeCIDRs: []
    # The cluster's service range (the cluster DNS Service, the API Service).
    # Required when enabled.
    serviceCIDR: ""
    # Further NetworkPolicy peers that answer DNS (a namespace selector, say),
    # listed before the service and node ranges.
    dnsPeers: []
    # argocd.argoproj.io/sync-wave of the policy; null renders none.
    syncWave: null
    # Overrides the chart's `protect`; null follows it.
    protect: null
