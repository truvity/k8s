apiVersion: v2
name: talos-etcd-backup
description: >-
  Scheduled etcd snapshots of a Talos cluster to an S3-compatible bucket,
  age-encrypted before they leave the cluster: a talos.dev ServiceAccount
  granting os:etcd:backup, a Kubernetes ServiceAccount, and a CronJob
  running siderolabs/talos-backup with static credentials or a hand-wired
  web identity token (no admission webhook in the path of the disaster
  recovery backup). Nothing here belongs to an estate.
type: application
# Placeholder: the git tag is the sole version authority. The release
# workflow stamps both fields from the tag (truvity/ci-workflows
# release-public.yaml).
version: 0.0.0
appVersion: 0.0.0
home: https://github.com/truvity/k8s
sources:
  - https://github.com/truvity/k8s
  - https://github.com/siderolabs/talos-backup
keywords:
  - talos
  - etcd
  - backup
maintainers:
