{{- include "talos-etcd-backup.check" . }}
---
# Talos API access: Talos answers this object with a Secret of the same name
# holding a talosconfig limited to the roles below.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: {{ .Values.talosServiceAccountName }}
  namespace: {{ .Release.Namespace }}
spec:
  roles:
    - os:etcd:backup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
