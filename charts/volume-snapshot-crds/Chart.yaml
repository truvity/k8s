apiVersion: v2
name: volume-snapshot-crds
description: >-
  The upstream CustomResourceDefinitions of kubernetes-csi/external-snapshotter at the version pinned in
  crdctl.yaml, mirrored verbatim. CRDs only; takes no values.
type: application
# A MIRROR chart (component contract C1): the version is the UPSTREAM
# version it mirrors, declared by the annotation below; `just crds` keeps
# the annotation, version and appVersion equal to crdctl.yaml's repo and
# pinned_version (checked by crd-charts-lint), and the release publishes the
# chart at that version only if it is not already in the registry.
version: 8.6.0
appVersion: "8.6.0"
annotations:
  truvity.io/mirror: "kubernetes-csi/external-snapshotter@8.6.0"
home: https://github.com/truvity/k8s
sources:
  - https://github.com/truvity/k8s
  - https://github.com/kubernetes-csi/external-snapshotter
