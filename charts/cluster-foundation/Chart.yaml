apiVersion: v2
name: cluster-foundation
description: >-
  The objects a cluster needs before any workload, as data. Namespaces with
  their Pod Security labels (level, version and every mode explicit, a reason
  for each exemption) and their deletion protection; ClusterRoleBindings for
  groups; StorageClasses; and, on EKS Auto Mode, the switch that turns the
  NetworkPolicy controller on. Every name, level, group and label is a value:
  nothing here belongs to an estate.
type: application
# Placeholder: the git tag is the sole version authority. The release
# workflow stamps both fields from the tag (truvity/ci-workflows
# release-public.yaml).
version: 0.0.0
appVersion: 0.0.0
home: https://github.com/truvity/k8s
sources:
  - https://github.com/truvity/k8s
keywords:
  - namespaces
  - pod-security
  - rbac
  - storageclass
  - eks-auto-mode
maintainers:
  - name: Truvity
    url: https://github.com/truvity
