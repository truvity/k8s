apiVersion: v2
name: eks-auto-node-pools
description: >-
  Karpenter NodePools, and the NodeClasses they need, for an EKS Auto Mode
  cluster, as data. A pool names its architectures, capacity types, instance
  categories and taints; one disruption budget per pool keeps a consolidation
  from moving more than one node at a time. Subnet and security-group tags,
  roles and sizes are values: nothing here belongs to an estate.
type: application
