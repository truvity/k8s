{{- include "cluster-pki.check" . }}
{{- $v := .Values }}
{{- $rootSecret := ternary $v.root.secretName $v.root.existingSecret (eq $v.root.mode "self-signed") }}
{{- $rootIssuer := printf "%s-root" $v.issuer.name }}
{{- if eq $v.root.mode "self-signed" }}
---
# Bootstrap only: signs the root and nothing else.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $v.issuer.name }}-selfsigned
  {{- with include "cluster-pki.annotations" $ }}{{ . | nindent 2 }}{{ end }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $v.root.secretName }}
  namespace: {{ .Release.Namespace }}
  {{- with include "cluster-pki.annotations" $ }}{{ . | nindent 2 }}{{ end }}
spec:
  {{- include "cluster-pki.caSpec" (dict "c" $v.root "issuer" (printf "%s-selfsigned" $v.issuer.name)) | nindent 2 }}
{{- end }}
{{- if $v.intermediate.enabled }}
---
# The root as an issuer, for the intermediate only.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $rootIssuer }}
  {{- with include "cluster-pki.annotations" $ }}{{ . | nindent 2 }}{{ end }}
spec:
  ca:
    secretName: {{ $rootSecret }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $v.intermediate.secretName }}
  namespace: {{ .Release.Namespace }}
  {{- with include "cluster-pki.annotations" $ }}{{ . | nindent 2 }}{{ end }}
spec:
  {{- include "cluster-pki.caSpec" (dict "c" $v.intermediate "issuer" $rootIssuer) | nindent 2 }}
{{- end }}
---
# What workloads use.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $v.issuer.name }}
  {{- with include "cluster-pki.annotations" $ }}{{ . | nindent 2 }}{{ end }}
spec:
  ca:
    secretName: {{ ternary $v.intermediate.secretName $rootSecret $v.intermediate.enabled }}
