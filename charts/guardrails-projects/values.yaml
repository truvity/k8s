# Nothing here names an estate: the rows and every rule are the caller's.
# The render produces nothing until a row is listed.

# --- Data protection ----------------------------------------------------------
# Objects whose loss loses something carry
# argocd.argoproj.io/sync-options: Prune=false,Delete=false (and, with
# helmKeep, helm.sh/resource-policy: keep): the Namespace (everything in it)
# unless the row is `deletable`, and the IAMRoleSelector (removing it widens
# what the namespace's AWS resources run as). Everything else is prunable.
helmKeep: false

# --- Pod Security -------------------------------------------------------------
# The default every row's Namespace gets. A row may set its own `level` or
# `modes`; any departure from these needs the row's `reason`, recorded in
# `reasonAnnotation`.
podSecurity:
  level: restricted
  # Pin a Kubernetes minor ("v1.34") before enforcing; "" renders no
  # *-version label (the API server reads it as latest).
  version: ""
  modes: [warn, audit]
  reasonAnnotation: guardrails-projects/psa-reason

# --- Baseline NetworkPolicy ---------------------------------------------------
# One NetworkPolicy per row: default deny both ways, the namespace's own pods
# (intraNamespace) and these rules. A rule is a NetworkPolicy ingress (`from`)
# or egress (`to`) rule verbatim with `ports`, plus a required `description`
# and an optional `kinds`: only rows of those kinds get it.
#
#   networkPolicy:
#     ingress:
#       - description: the shared gateway
#         from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateway}}}]
#       - description: CI runners reach the namespace's Services
#         kinds: [ci]
#         from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: runners}}}]
#     egress:
#       - description: cluster DNS
#         to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
#         ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
networkPolicy:
  name: project-baseline
  intraNamespace: true
  ingress: []
  egress: []
  # The egress every workload of an EKS cluster needs, appended after
  # `egress` for every row: the API server (443 to the node and service
  # ranges), HTTPS to the internet but the instance metadata service, the EKS
  # Pod Identity Agent (169.254.170.23:80) and DNS (53 to dnsPeers, the
  # service range and the node ranges).
  eksEgress:
    enabled: false
    # The node range (the VPC): the API endpoint lives in it. Required when
    # enabled.
    nodeCIDRs: []
    # The cluster's service range. Required when enabled.
    serviceCIDR: ""
    # Further NetworkPolicy peers that answer DNS, listed first.
    dnsPeers: []

# --- Quotas -------------------------------------------------------------------
# By profile name; a row names one in `quota`. A ResourceQuota (`hard`) and,
# optionally, a LimitRange's Container defaults (`limitRange`).
#
#   quotas:
#     ci:
#       hard: {requests.cpu: "16", requests.memory: 32Gi}
#       limitRange: {defaultRequest: {cpu: 50m}, default: {memory: 512Mi}}
quotas: {}
quotaName: project-quota
limitRangeName: project-defaults

# --- ClusterRoles -------------------------------------------------------------
# Shared by the rows, typically rights on operator CRDs aggregated into a
# built-in role (`aggregateTo`: admin, edit, view).
clusterRoles: {}

# --- ACK IAMRoleSelectors -----------------------------------------------------
# For a row with `ackRoleARN`: the cluster-scoped IAMRoleSelector
# <namePrefix><namespace>, binding that role to the namespace by name, so the
# ACK controllers reconcile the namespace's AWS resources with it.
ackRoleSelectors:
  namePrefix: ""

# --- EKS Pod Identity ---------------------------------------------------------
# For each name a row lists in `podIdentities`: a ServiceAccount of that name in
# the row's namespace and an ACK PodIdentityAssociation <namespace>-<name> in
# `associationNamespace`, out of the namespace's reach.
#
#   podIdentities:
#     clusterName: my-cluster
#     associations:
#       test-s3: {roleARN: "<the IAM role ARN>", associationNamespace: identity-system}
podIdentities:
  clusterName: ""
  associations: {}

# --- PodIdentityAssociation admission -----------------------------------------
# A ValidatingAdmissionPolicy and its binding for ACK PodIdentityAssociations
# (eks.services.k8s.aws). A project that can create one can bind a pod of its
# namespace to any IAM role the EKS controller may pass, so the policy refuses
# an association unless spec.namespace is the namespace it lives in and
# spec.roleARN is a role of that namespace's project: one of the row's
# `podIdentityRolePrefixes` followed by a name without a path. A namespace with
# no row, or a row with no prefixes, has no ceiling and may not create any
# (default deny).
#
# Off by default: the render is unchanged until a cluster turns it on.
#
# Exempt by name, because their associations bind other namespaces by design:
# `exemptNamespaces` and the `associationNamespace` of every
# `podIdentities.associations` entry above.
#
# Roll out in observe mode, read the audit log, then enforce:
#   validationActions: [Warn, Audit]   # default: admitted, warned, audited
#   validationActions: [Deny, Audit]   # enforce (Deny cannot be combined with Warn)
podIdentityAdmission:
  enabled: false
  name: ack-pod-identity-association-guard
  validationActions: [Warn, Audit]
  # Fail: an evaluation error follows validationActions like any other failure.
  failurePolicy: Fail
  # Namespaces whose associations are not a project's, for example the one
  # of a database operator:
  #   exemptNamespaces: [cnpg-system]
  exemptNamespaces: []

# --- The rows -----------------------------------------------------------------
# One per project namespace:
#
#   projects:
#     - name: shop                         # the namespace
#       kind: product                      # matched by the rules' `kinds`
#       labels: {example.com/project: shop}
#       podSecurity: {level: baseline, modes: [warn, audit], reason: "..."}
#       quota: ci                          # a `quotas` profile
#       deletable: false                   # true: removing the row deletes it
#       roles:
#         read-certs: {rules: [{apiGroups: [cert-manager.io], resources: [certificaterequests], verbs: [create]}]}
#       roleBindings:
#         - {name: deployers, clusterRole: edit, subjects: [{kind: Group, name: "shop:deployer"}]}
#         - {name: certs, role: read-certs, subjects: [{kind: Group, name: "system:serviceaccounts:shop"}]}
#       ackRoleARN: "<the IAM role ARN>"
#       podIdentityRolePrefixes:           # with podIdentityAdmission: the roles the namespace's associations may bind
#         - "arn:<partition>:iam::<account>:role/<cluster>-<project>."
#       podIdentities: [test-s3]           # names under podIdentities.associations
projects: []
