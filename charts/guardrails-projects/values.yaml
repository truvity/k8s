# Nothing here names an estate: the rows and every rule are the caller's.
# The render produces nothing until a row is listed.

# --- Data protection ----------------------------------------------------------
# Objects whose loss loses something carry
# argocd.argoproj.io/sync-options: Prune=false,Delete=false (and, with
# helmKeep, helm.sh/resource-policy: keep): the Namespace (everything in it)
# unless the row is `deletable`, and the IAMRoleSelector (removing it widens
# what the namespace's AWS resources run as). Everything else is prunable.
helmKeep: false

# --- Pod Security -------------------------------------------------------------
# The default every row's Namespace gets. A row may set its own `level` or
# `modes`; any departure from these needs the row's `reason`, recorded in
# `reasonAnnotation`.
podSecurity:
  level: restricted
  # Pin a Kubernetes minor ("v1.34") before enforcing; "" renders no
  # *-version label (the API server reads it as latest).
  version: ""
  modes: [warn, audit]
  reasonAnnotation: guardrails-projects/psa-reason

# --- Baseline NetworkPolicy ---------------------------------------------------
# One NetworkPolicy per row: default deny both ways, the namespace's own pods
# (intraNamespace) and these rules. A rule is a NetworkPolicy ingress (`from`)
# or egress (`to`) rule verbatim with `ports`, plus a required `description`
# and an optional `kinds`: only rows of those kinds get it.
#
#   networkPolicy:
#     ingress:
#       - description: the shared gateway
#         from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateway}}}]
#       - description: CI runners reach the namespace's Services
#         kinds: [ci]
#         from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: runners}}}]
#     egress:
#       - description: cluster DNS
#         to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
#         ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
networkPolicy:
  name: project-baseline
  intraNamespace: true
  ingress: []
  egress: []
  # The egress every workload of an EKS cluster needs, appended after
  # `egress` for every row: the API server (443 to the node and service
  # ranges), HTTPS to the internet but the instance metadata service, the EKS
  # Pod Identity Agent (169.254.170.23:80) and DNS (53 to dnsPeers, the
  # service range and the node ranges).
  eksEgress:
    enabled: false
    # The node range (the VPC): the API endpoint lives in it. Required when
    # enabled.
    nodeCIDRs: []
    # The cluster's service range. Required when enabled.
    serviceCIDR: ""
    # Further NetworkPolicy peers that answer DNS, listed first.
    dnsPeers: []
  # Ingress from tailnets, per tailnet: a row admits only the tailnets it
  # lists in `tailnets`, each by its own identity, appended after `ingress`.
  # A tailnet's identity is a namespace label: every subnet router namespace
  # carries `routerLabel` with the name of its tailnet as the value, and a
  # row listing tailnet `a` admits the router pods (`routerPodSelector`) of
  # the namespaces labelled `<routerLabel>: a` only, plus that tailnet's own
  # `peers` (sources no other tailnet uses, such as the address of its
  # subnet router outside the cluster). A tailnet declares the ports its
  # traffic may reach, or says `allPorts: true`; exactly one of the two.
  #
  #   tailnetIngress:
  #     enabled: true
  #     routerLabel: example.com/tailnet
  #     routerPodSelector: {matchLabels: {app.kubernetes.io/name: tailscaled}}
  #     tailnets:
  #       corp: {allPorts: true, peers: [{ipBlock: {cidr: 10.0.4.10/32}}]}
  #       partner: {ports: [{port: 443, protocol: TCP}]}
  #   projects:
  #     - {name: shop, kind: product, tailnets: [corp]}
  #
  # A row that lists no tailnet admits none. A label that every router
  # namespace carries, or a source range several tailnets share, cannot
  # tell the tailnets apart; `shared` admits such peers, on every port,
  # into every row that lists any tailnet. That is the behaviour before
  # tailnets had an identity, kept for compatibility: it crosses tailnets,
  # so it is off unless enabled, and needs a `reason`.
  tailnetIngress:
    enabled: false
    # The namespace label whose value names a router namespace's tailnet.
    # Required when enabled.
    routerLabel: ""
    # The router's pods in its namespace; empty selects every pod there.
    routerPodSelector: {}
    # By tailnet name (a label value): `ports` (NetworkPolicy ports) or
    # `allPorts: true`, and optional further `peers`.
    tailnets: {}
    shared:
      enabled: false
      reason: ""
      # NetworkPolicy peers, verbatim.
      peers: []

# --- Quotas -------------------------------------------------------------------
# By profile name; a row names one in `quota`. A ResourceQuota (`hard`) and,
# optionally, a LimitRange's Container defaults (`limitRange`).
#
#   quotas:
#     ci:
#       hard: {requests.cpu: "16", requests.memory: 32Gi}
#       limitRange: {defaultRequest: {cpu: 50m}, default: {memory: 512Mi}}
quotas: {}
quotaName: project-quota
limitRangeName: project-defaults

# --- ClusterRoles -------------------------------------------------------------
# Shared by the rows, typically rights on operator CRDs aggregated into a
# built-in role (`aggregateTo`: admin, edit, view).
clusterRoles: {}

# --- ACK IAMRoleSelectors -----------------------------------------------------
# For a row with `ackRoleARN`: the cluster-scoped IAMRoleSelector
# <namePrefix><namespace>, binding that role to the namespace by name, so the
# ACK controllers reconcile the namespace's AWS resources with it.
ackRoleSelectors:
  namePrefix: ""

# --- EKS Pod Identity ---------------------------------------------------------
# For each name a row lists in `podIdentities`: a ServiceAccount of that name in
# the row's namespace and an ACK PodIdentityAssociation <namespace>-<name> in
# `associationNamespace`, out of the namespace's reach.
#
#   podIdentities:
#     clusterName: my-cluster
#     associations:
#       test-s3: {roleARN: "<the IAM role ARN>", associationNamespace: identity-system}
podIdentities:
  clusterName: ""
  associations: {}

# --- PodIdentityAssociation admission -----------------------------------------
# A ValidatingAdmissionPolicy and its binding for ACK PodIdentityAssociations
# (eks.services.k8s.aws). A project that can create one can bind a pod of its
# namespace to any IAM role the EKS controller may pass, so the policy refuses
# an association unless spec.namespace is the namespace it lives in and its
# role is a role of that namespace's project, by one of two checks (both must
# pass when both are set):
#   - spec.roleARN: one of the row's `podIdentityRolePrefixes` followed by a
#     name without a path (the project prefix within the ceiling).
#   - spec.roleRef: an ACK iam Role of the same namespace only
#     (roleRef.from.namespace absent or equal), whose name starts with the
#     role-name part of one of the prefixes. This is a name-convention check:
#     CEL cannot read the Role, so the charts name a Role after its IAM role
#     and the namespace's own Roles stay bounded by their builder and
#     permissions boundary.
# A namespace with no row, or a row with no prefixes, has no ceiling and may
# not create any (default deny).
#
# The policy does not check spec.clusterName, spec.clusterRef or
# spec.serviceAccount.
#
# Off by default: the render is unchanged until a cluster turns it on.
#
# Exempt by name, because their associations bind other namespaces by design:
# `exemptNamespaces` and the `associationNamespace` of every
# `podIdentities.associations` entry above.
#
# Roll out in observe mode, read the audit log, then enforce:
#   validationActions: [Warn, Audit]   # default: admitted, warned, audited
#   validationActions: [Deny, Audit]   # enforce (Deny cannot be combined with Warn)
podIdentityAdmission:
  enabled: false
  name: ack-pod-identity-association-guard
  validationActions: [Warn, Audit]
  # Fail: an evaluation error follows validationActions like any other failure.
  failurePolicy: Fail
  # Namespaces whose associations are not a project's, for example the one
  # of a database operator:
  #   exemptNamespaces: [cnpg-system]
  exemptNamespaces: []

# --- Image allow-list ---------------------------------------------------------
# A ValidatingAdmissionPolicy and its binding for the images of a namespace's
# pods: containers, init containers, ephemeral containers (`kubectl debug`) and
# image volumes. One node role per cluster pulls every image, so what a
# namespace may run comes from a list of registry prefixes per namespace.
#
# An entry is `host[:port]/path`, lower case, no `*`, no tag, no digest.
#   registry.example/shop/      a path prefix: everything below shop/, not shop-evil/
#   registry.example/shop/api   exactly that repository, any tag or digest
# An image with no registry host (`nginx`) never matches: write the registry.
#
#   imageAllowList:
#     enabled: true
#     kinds: [product, ci]                 # a row of these kinds MUST carry a list or `exempt`
#     common: [registry.example/mesh/]     # admitted in every checked namespace
#     sets:
#       shop: [registry.example/shop/]
#   projects:
#     - {name: shop, kind: product, images: {sets: [shop], allow: [registry.example/tools/debug]}}
#     - {name: legacy, kind: product, images: {exempt: "images move to the shop registry by Q3"}}
#
# A row's list is `common` plus its `sets` plus its `allow`. A row with none
# (and not of a kind in `kinds`) is not checked, as is a namespace with no row:
# pods exist in every namespace, so the platform's must not be refused by
# default. The hole is closed by `kinds`, and by `exempt`, a reasoned debt.
#
# Off by default: the render is unchanged until a cluster turns it on. Roll
# out in observe mode, read the audit annotation, then enforce:
#   validationActions: [Warn, Audit]   # default: admitted, warned, audited
#   validationActions: [Deny, Audit]   # enforce (Deny cannot be combined with Warn)
# Enforce one namespace at a time with `images.enforce: true` on its row: a
# second binding, `<name>-enforce` ([Deny, Audit]), selects the enforcing rows'
# namespaces and the main binding selects every other one.
imageAllowList:
  enabled: false
  name: pod-image-allow-list
  validationActions: [Warn, Audit]
  failurePolicy: Fail
  # Row kinds that must carry an allow-list or an `exempt` reason. Empty: no
  # row is forced to have one.
  kinds: []
  # Prefixes admitted in every checked namespace (an injected sidecar, a debug image).
  common: []
  # By name: the prefixes of one registry owner.
  sets: {}

# --- The rows -----------------------------------------------------------------
# One per project namespace:
#
#   projects:
#     - name: shop                         # the namespace
#       kind: product                      # matched by the rules' `kinds`
#       labels: {example.com/project: shop}
#       podSecurity: {level: baseline, modes: [warn, audit], reason: "..."}
#       quota: ci                          # a `quotas` profile
#       deletable: false                   # true: removing the row deletes it
#       roles:
#         read-certs: {rules: [{apiGroups: [cert-manager.io], resources: [certificaterequests], verbs: [create]}]}
#       roleBindings:
#         - {name: deployers, clusterRole: edit, subjects: [{kind: Group, name: "shop:deployer"}]}
#         - {name: certs, role: read-certs, subjects: [{kind: Group, name: "system:serviceaccounts:shop"}]}
#       ackRoleARN: "<the IAM role ARN>"
#       podIdentityRolePrefixes:           # with podIdentityAdmission: the roles the namespace's associations may bind
#         - "arn:<partition>:iam::<account>:role/<cluster>-<project>."
#       podIdentities: [test-s3]           # names under podIdentities.associations
#       tailnets: [corp]                   # names under networkPolicy.tailnetIngress.tailnets
#       images:                            # with imageAllowList: the registries its pods may pull from
#         sets: [shop]                     # names under imageAllowList.sets
#         allow: [registry.example/tools/debug]
#         exempt: "<why the row is not checked>"   # instead of a list
#         enforce: true                    # deny for this row (needs a list), whatever validationActions says
projects: []
