apiVersion: v2
name: guardrails-projects
description: >-
  The guardrails of every project namespace of a cluster, from a list of
  project rows: for each row its Namespace (labels, Pod Security level and
  modes), a baseline NetworkPolicy (default deny both ways, the namespace's
  own pods, the shared allow rules, filtered by the row's kind), a quota
  and LimitRange by profile, its Roles and RoleBindings, and an ACK
  IAMRoleSelector binding its capability-ceiling role by name; plus the
  shared ClusterRoles. One Application renders every project's rows.
  Cluster-agnostic: every name, rule and number is a value.
type: application
# Placeholder: the git tag is the sole version authority. The release
# workflow stamps both fields from the tag (truvity/ci-workflows
# release-public.yaml).
version: 0.0.0
appVersion: 0.0.0
home: https://github.com/truvity/k8s
sources:
  - https://github.com/truvity/k8s
keywords:
  - multi-tenancy
  - pod-security
  - networkpolicy
  - resourcequota
  - rbac
  - ack
maintainers:
