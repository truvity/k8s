{{- /*
For each name a row lists in `podIdentities`: a ServiceAccount of that name in
the row's namespace, and the ACK PodIdentityAssociation <namespace>-<name> in
the association's own namespace, out of the namespace's reach (a namespace
that can edit itself could otherwise delete its credentials' binding).
*/ -}}
{{- $root := . -}}
{{- $pi := .Values.podIdentities -}}
{{- range $p := .Values.projects }}
{{- range $name := $p.podIdentities | default list }}
{{- if not $pi.clusterName }}{{ fail (printf "podIdentities.clusterName is required: projects.%s lists podIdentities" $p.name) }}{{ end }}
{{- if not (hasKey ($pi.associations | default dict) $name) }}
{{- fail (printf "projects.%s.podIdentities names %q, which is not in podIdentities.associations" $p.name $name) }}
{{- end }}
{{- $a := index $pi.associations $name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $p.name }}
---
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: {{ printf "%s-%s" $p.name $name }}
  namespace: {{ $a.associationNamespace }}
spec:
  clusterName: {{ $pi.clusterName }}
  namespace: {{ $p.name }}
  serviceAccount: {{ $name }}
  roleARN: {{ $a.roleARN | quote }}
{{- end }}
{{- end }}
