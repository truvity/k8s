version: v1alpha1
debug: false
persist: true
machine:
    type: controlplane
    token: <random>
    ca:
        crt: <base64>
        key: PHJlZGFjdGVkPg==
    certSANs:
        - api.example.com
    features:
        diskQuotaSupport: true
cluster:
    token: <random>
    etcd:
        ca:
            crt: <base64>
            key: PHJlZGFjdGVkPg==
        advertisedSubnets:
            - 10.0.0.0/24
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
endpoint: https://discovery.talos.dev/
---
apiVersion: v1alpha1
kind: DiscoveryIdentityConfig
clusterID: <random>
clusterSecret: <redacted>
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
    enabled: true
    forwardKubeDNSToHost: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
mount:
    secure: true
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: true
---
apiVersion: v1alpha1
kind: KubeClusterConfig
clusterName: example
endpoint: https://10.0.0.10:6443
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
    validSubnets:
        - 10.0.0.0/24
labels:
    node-role.kubernetes.io/control-plane: ""
    node.kubernetes.io/exclude-from-external-load-balancers: ""
taints:
    node-role.kubernetes.io/control-plane: PreferNoSchedule
---
apiVersion: v1alpha1
kind: KubeletConfig
image: ghcr.io/siderolabs/kubelet:v1.36.4
config: {}
defaultRuntimeSeccompProfileEnabled: true
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
    - 10.244.0.0/16
serviceSubnets:
    - 10.96.0.0/12
---
apiVersion: v1alpha1
kind: KubeAPIServerCAConfig
issuingCA:
    cert: |
        <pem>
    key: <redacted>
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
apiVersion: v1alpha1
kind: KubeAggregatorCAConfig
issuingCA:
    cert: |
        <pem>
    key: <redacted>
---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
    apiVersion: pod-security.admission.config.k8s.io/v1alpha1
    defaults:
        audit: restricted
        audit-version: latest
        enforce: baseline
        enforce-version: latest
        warn: restricted
        warn-version: latest
    exemptions:
        namespaces:
            - kube-system
        runtimeClasses: []
        usernames: []
    kind: PodSecurityConfiguration
---
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
        - level: Metadata
---
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
    anonymous:
        conditions:
            - path: /livez
            - path: /readyz
            - path: /healthz
        enabled: true
    jwt: []
---
apiVersion: v1alpha1
kind: KubeAuthorizerConfig
name: node
type: Node
---
apiVersion: v1alpha1
kind: KubeAuthorizerConfig
name: rbac
type: RBAC
---
apiVersion: v1alpha1
kind: KubeEtcdEncryptionConfig
config:
    resources:
        - providers:
            - secretbox:
                keys:
                    - name: key2
                      secret: <random>
          resources:
            - secrets
---
apiVersion: v1alpha1
kind: KubeServiceAccountConfig
issuer:
    privateKey: <redacted>
    issuerURL: https://oidc.example.com/example
accepted:
    issuers:
        - https://10.0.0.10:6443
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
image: registry.k8s.io/kube-apiserver:v1.36.4
extraArgs:
    service-account-jwks-uri: https://oidc.example.com/example/openid/v1/jwks
certExtraSANs:
    - api.example.com
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
image: registry.k8s.io/kube-controller-manager:v1.36.4
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
image: registry.k8s.io/kube-scheduler:v1.36.4
config: {}
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
image: registry.k8s.io/kube-proxy:v1.36.4
config: {}
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: true
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
    image: factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.14.2
provisioning:
    diskSelector:
        match: disk.dev_path == "/dev/nvme0n1"
    wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: cp-2
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.0.0.10
link: eth0
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
    - os:etcd:backup
allowedKubernetesNamespaces:
    - etcd-backup
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: docker.io
endpoints:
    - url: https://mirror.example.com/v2/docker.io
      overridePath: true
