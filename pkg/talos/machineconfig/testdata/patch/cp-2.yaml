version: v1alpha1
cluster:
    etcd:
        advertisedSubnets:
            - 10.0.0.0/24
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
    image: factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.14.2
provisioning:
    diskSelector:
        match: disk.dev_path == "/dev/nvme0n1"
    wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: cp-2
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
    validSubnets:
        - 10.0.0.0/24
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeServiceAccountConfig
accepted:
    issuers:
        - https://10.0.0.10:6443
issuer:
    issuerURL: https://oidc.example.com/example
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
    service-account-jwks-uri: https://oidc.example.com/example/openid/v1/jwks
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.0.0.10
link: eth0
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedKubernetesNamespaces:
    - etcd-backup
allowedRoles:
    - os:etcd:backup
