autoDirectNodeRoutes: true
bpf:
    masquerade: true
cgroup:
    autoMount:
        enabled: false
    hostRoot: /sys/fs/cgroup
devices:
    - eth0
externalIPs:
    enabled: true
hubble:
    enabled: false
    relay:
        enabled: false
ipam:
    mode: kubernetes
ipv4NativeRoutingCIDR: 10.244.0.0/16
k8sClientRateLimit:
    burst: 100
    qps: 50
k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true
l2announcements:
    enabled: true
operator:
    replicas: 2
policyAuditMode: false
policyEnforcementMode: default
routingMode: native
securityContext:
    capabilities:
        ciliumAgent:
            - CHOWN
            - KILL
            - NET_ADMIN
            - NET_RAW
            - IPC_LOCK
            - SYS_ADMIN
            - SYS_RESOURCE
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
        cleanCiliumState:
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_RESOURCE
