clusterName: example-cluster
subnetSelectorTags:
  example.com/subnet-tier: nodes
  kubernetes.io/cluster/example-cluster: shared
podSubnetSelectorTags:
  example.com/subnet-tier: pods
  kubernetes.io/cluster/example-cluster: shared
nodePools:
  # A pool with a class of its own: bigger disk, pod IPs from the pod subnets.
  - name: ci
    archs: [arm64]
    capacityTypes: [on-demand]
    categories: [r]
    taints:
      - {key: ci, value: "true", effect: NoSchedule}
    cpuLimit: 224
    maxInstanceCpu: 8
    instanceTypes: [r6g.2xlarge]
    consolidationPolicy: WhenEmpty
    consolidateAfter: 90s
    expireAfter: 48h0m0s
    terminationGracePeriod: 2h0m0s
    fastEmptyReclaim: true
    zones: [zone-a]
    nodeClass:
      name: ci
      role: example-node-role
      podSubnets: true
      ephemeralStorage: {size: 200Gi, iops: 3000, throughput: 125}
  # A large stateless pool: the default budget is a share of the nodes.
  - name: volatile
    archs: [arm64, amd64]
    capacityTypes: [spot]
    categories: [m]
    disruptionNodes: "20%"
    nodeClassName: standard
  # Pools on a shared class.
  - name: durable
    archs: [arm64]
    capacityTypes: [on-demand]
    categories: [t, m]
    consolidationPolicy: WhenEmpty
    taints:
      - {key: durable, value: "true", effect: NoSchedule}
    nodeClassName: standard
  # A pool that voluntary replacement may touch only inside a window: the
  # budgets are the complement of Tue, Wed, Thu 01:00-03:00 UTC.
  - name: windowed
    archs: [arm64]
    capacityTypes: [on-demand]
    categories: [t, m]
    consolidationPolicy: WhenEmpty
    taints:
      - {key: windowed, value: "true", effect: NoSchedule}
    nodeClassName: standard
    budgets:
      - {nodes: "0", reasons: [Drifted, Underutilized], schedule: "0 3 * * 2", duration: 22h}
      - {nodes: "0", reasons: [Drifted, Underutilized], schedule: "0 3 * * 3", duration: 22h}
      - {nodes: "0", reasons: [Drifted, Underutilized], schedule: "0 3 * * 4", duration: 118h}
      - {nodes: "20%"}
  - name: general
    weight: 10
    archs: [arm64, amd64]
    capacityTypes: [spot, on-demand]
    categories: [m, r]
    nodeClassName: standard
  # A pool on the built-in `default`.
  - name: plain
    archs: [amd64]
    capacityTypes: [on-demand]
    categories: [m]
nodeClasses:
  - name: standard
    role: example-node-role
    ephemeralStorage: {size: 80Gi, iops: 3000, throughput: 125}
