# An S3-compatible store with static keys and path-style addressing.
image: {tag: v0.1.0-beta.3}
clusterName: example
schedule: "0 */6 * * *"
timeZone: Etc/UTC
s3:
  bucket: backups
  prefix: clusters/example/etcd
  region: auto
  endpoint: https://s3.example.com
  pathStyle: true
encryption: {ageRecipient: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq}
credentials: {secretName: backup-credentials}
tolerations:
  - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
