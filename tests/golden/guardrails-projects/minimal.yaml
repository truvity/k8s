---
# Source: guardrails-projects/templates/namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

---
# Source: guardrails-projects/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-baseline
  namespace: shop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # the namespace's own pods
    - from:
        - podSelector: {}
  egress:
    # the namespace's own pods
    - to:
        - podSelector: {}
