# Source: guardrails-projects/templates/pod-identity-admission.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ack-pod-identity-association-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["eks.services.k8s.aws"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["podidentityassociations"]
  matchConditions:
    - name: platform-namespaces-are-exempt
      expression: "!(object.metadata.namespace in [\"identity-system\"])"
    - name: only-spec-changes
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  variables:
    - name: rolePrefixes
      expression: "{\"arch\":[\"arn:example:iam::acct-one:role/prod-acme-arch-\"],\"docs\":[\"arn:example:iam::acct-one:role/prod-acme-docs.\"],\"shop\":[\"arn:example:iam::acct-one:role/prod-acme-shop-\"]}"
    - name: targetAccounts
      expression: "{\"arch\":[\"acct-four\"],\"docs\":[\"acct-three\"],\"shop\":[\"acct-five\",\"acct-two\"]}"
  validations:
    - expression: "has(object.spec.namespace) && object.spec.namespace == object.metadata.namespace"
      message: "a PodIdentityAssociation binds the namespace it lives in: spec.namespace must equal metadata.namespace"
      reason: Forbidden
    - expression: "object.metadata.namespace in variables.rolePrefixes"
      message: "this namespace has no IAM role ceiling: it may not create PodIdentityAssociations"
      reason: Forbidden
    - expression: >-
        !(object.metadata.namespace in variables.rolePrefixes) ||
        has(object.spec.roleARN) || has(object.spec.roleRef)
      message: "a PodIdentityAssociation names its role: set spec.roleARN or spec.roleRef"
      reason: Forbidden
    - expression: >-
        !(object.metadata.namespace in variables.rolePrefixes) || !has(object.spec.roleARN) ||
        variables.rolePrefixes[object.metadata.namespace].exists(p,
          object.spec.roleARN.startsWith(p) && !object.spec.roleARN.substring(p.size()).contains('/'))
      message: "spec.roleARN must be a role of this namespace's project: one of its podIdentityRolePrefixes followed by a name, no path"
      reason: Forbidden
    - expression: >-
        !(object.metadata.namespace in variables.rolePrefixes) || !has(object.spec.roleRef) ||
        (has(object.spec.roleRef.from) && has(object.spec.roleRef.from.name) &&
         (!has(object.spec.roleRef.from.namespace) || object.spec.roleRef.from.namespace == object.metadata.namespace) &&
         variables.rolePrefixes[object.metadata.namespace].exists(p,
           object.spec.roleRef.from.name.startsWith(p.substring(p.lastIndexOf('/') + 1))))
      message: "spec.roleRef must name a Role of this namespace's project: roleRef.from.namespace absent or this namespace, and a name that starts with the role-name part of one of its podIdentityRolePrefixes"
      reason: Forbidden
    - expression: >-
        !(object.metadata.namespace in variables.rolePrefixes) || !has(object.spec.targetRoleARN) ||
        (object.spec.targetRoleARN.split(':').size() == 6 &&
         variables.rolePrefixes[object.metadata.namespace].exists(p,
           object.spec.targetRoleARN.split(':')[0] == 'arn' &&
           object.spec.targetRoleARN.split(':')[1] == p.split(':')[1] &&
           object.spec.targetRoleARN.split(':')[2] == 'iam' &&
           object.spec.targetRoleARN.split(':')[3] == '' &&
           object.spec.targetRoleARN.split(':')[5].startsWith('role/' + p.substring(p.lastIndexOf('/') + 1)) &&
           !object.spec.targetRoleARN.split(':')[5].substring(5).contains('/')))
      message: "spec.targetRoleARN must be a role of this namespace's project: an IAM role ARN with no path whose name starts with the role-name part of one of its podIdentityRolePrefixes"
      reason: Forbidden
    - expression: >-
        !(object.metadata.namespace in variables.rolePrefixes) || !has(object.spec.targetRoleARN) ||
        (object.spec.targetRoleARN.split(':').size() == 6 &&
         object.metadata.namespace in variables.targetAccounts &&
         object.spec.targetRoleARN.split(':')[4] in variables.targetAccounts[object.metadata.namespace])
      message: "spec.targetRoleARN must be in an account this namespace may target (podIdentityTargetAccounts); a namespace with no target account may not set it"
      reason: Forbidden
    - expression: "!has(object.spec.targetRoleRef)"
      message: "spec.targetRoleRef is not allowed: name the target with spec.targetRoleARN (podIdentityAdmission.allowTargetRoleRef is false)"
      reason: Forbidden

