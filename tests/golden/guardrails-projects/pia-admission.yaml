---
# Source: guardrails-projects/templates/pod-identity-admission.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ack-pod-identity-association-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["eks.services.k8s.aws"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["podidentityassociations"]
  matchConditions:
    - name: platform-namespaces-are-exempt
      expression: "!(object.metadata.namespace in [\"identity-system\",\"platform-db\"])"
    - name: only-spec-changes
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  variables:
    - name: rolePrefixes
      expression: "{\"docs\":[\"arn:example:iam::placeholder:role/example-docs.\",\"arn:example:iam::placeholder:role/example-docs-legacy-\"],\"shop\":[\"arn:example:iam::placeholder:role/example-shop.\"]}"
  validations:
    - expression: "has(object.spec.namespace) && object.spec.namespace == object.metadata.namespace"
      message: "a PodIdentityAssociation binds the namespace it lives in: spec.namespace must equal metadata.namespace"
      reason: Forbidden
    - expression: "object.metadata.namespace in variables.rolePrefixes"
      message: "this namespace has no IAM role ceiling: it may not create PodIdentityAssociations"
      reason: Forbidden
    - expression: >-
        !(object.metadata.namespace in variables.rolePrefixes) ||
        (has(object.spec.roleARN) &&
         variables.rolePrefixes[object.metadata.namespace].exists(p,
           object.spec.roleARN.startsWith(p) && !object.spec.roleARN.substring(p.size()).contains('/')))
      message: "spec.roleARN must be a role of this namespace's project: one of its podIdentityRolePrefixes followed by a name, no path"
      reason: Forbidden

---
# Source: guardrails-projects/templates/pod-identity-admission.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ack-pod-identity-association-guard
spec:
  policyName: ack-pod-identity-association-guard
  validationActions: ["Warn","Audit"]
