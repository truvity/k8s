# Source: guardrails-projects/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-baseline
  namespace: shop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # the namespace's own pods
    - from:
        - podSelector: {}
    # the shared gateway
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gateway
        podSelector:
          matchLabels:
            app.kubernetes.io/name: gateway
  egress:
    # the namespace's own pods
    - to:
        - podSelector: {}
    # cluster DNS
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - ipBlock:
          cidr: 10.0.0.0/16

---
# Source: guardrails-projects/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-baseline
  namespace: ci-shop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # the namespace's own pods
    - from:
        - podSelector: {}
    # the shared gateway
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gateway
        podSelector:
          matchLabels:
            app.kubernetes.io/name: gateway
    # CI runners reach the namespace's Services
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: runners
  egress:
    # the namespace's own pods
    - to:
        - podSelector: {}
    # cluster DNS
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - ipBlock:
          cidr: 10.0.0.0/16

