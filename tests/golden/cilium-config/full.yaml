---
# Source: cilium-config/templates/l2-announcements.yaml
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  interfaces:
    - ^eth[0-9]+$
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
  loadBalancerIPs: true
  externalIPs: false

---
# Source: cilium-config/templates/l2-announcements.yaml
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: external-ips
spec:
  interfaces:
    - ^eth0$
  serviceSelector:
    matchLabels:
      example.com/external-ip: "true"
  loadBalancerIPs: false
  externalIPs: true

---
# Source: cilium-config/templates/lb-ipam.yaml
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: internal
  annotations:
    example.com/owner: platform
spec:
  blocks:
    - cidr: 10.0.1.0/28
    - cidr: fd00:10::/124
  serviceSelector:
    matchLabels:
      example.com/exposure: internal
  allowFirstLastIPs: "No"

---
# Source: cilium-config/templates/lb-ipam.yaml
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "1"
spec:
  blocks:
    - start: 10.0.0.100
      stop: 10.0.0.149
  allowFirstLastIPs: "Yes"
