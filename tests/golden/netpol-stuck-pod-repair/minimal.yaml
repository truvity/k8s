---
# Source: netpol-stuck-pod-repair/templates/deployment.yaml
# TEMPORARY WORKAROUND for https://github.com/aws/aws-network-policy-agent/issues/676
# (fix https://github.com/aws/aws-network-policy-agent/pull/705). One replica,
# Recreate: the limits and the halt live in the process's memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-stuck-pod-repair
  namespace: netpol-repair
  labels:
    app.kubernetes.io/name: netpol-stuck-pod-repair
    app.kubernetes.io/instance: netpol-stuck-pod-repair
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "netpol-stuck-pod-repair-0.0.0"
  annotations:
    netpol-stuck-pod-repair.truvity.io/temporary: "Remove when the node image ships aws-network-policy-agent with PR 705 (issue 676)."
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netpol-stuck-pod-repair
      app.kubernetes.io/instance: netpol-stuck-pod-repair
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netpol-stuck-pod-repair
        app.kubernetes.io/instance: netpol-stuck-pod-repair
    spec:
      serviceAccountName: netpol-stuck-pod-repair
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: repair
          image: "ghcr.io/truvity/k8s/netpol-stuck-pod-repair:0.0.0"
          imagePullPolicy: IfNotPresent
          args:
            - --mode=report
            - --interval=1m
            - --restart-threshold=3
            - --restart-window=15m
            - --not-ready-after=10m
            - --single-replica-stuck-after=10m
            - --owner-cooldown=30m
            - --min-delete-interval=1m
            - --max-repairs=5
            - --halt-window=1h
            - "--namespaces="
            - "--exclude-namespaces=kube-system"
            - --max-node-age=0s
            - "--timeout-patterns=i/o timeout,connect: connection timed out"
            - --log-tail-lines=100
            - --node-diagnostic=false
            - "--node-diagnostic-destination=node"
            - --log-level=info
            - --metrics-address=:8080
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 30
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true

