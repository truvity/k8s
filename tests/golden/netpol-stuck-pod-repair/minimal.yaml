# Source: netpol-stuck-pod-repair/templates/rbac.yaml
# Cluster-wide, because the race can strand a pod in any namespace with a
# NetworkPolicy. Reads are what selection and evidence need; the only writes
# are deleting a pod, recording an Event and (opt-in) a NodeDiagnostic.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netpol-stuck-pod-repair
  labels:
    app.kubernetes.io/name: netpol-stuck-pod-repair
    app.kubernetes.io/instance: netpol-stuck-pod-repair
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "netpol-stuck-pod-repair-0.0.0"
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
  # The AWS network policy controller's endpoint lists, read as evidence.
  - apiGroups: [networking.k8s.aws]
    resources: [policyendpoints]
    verbs: [list]

