---
# Source: cluster-pki/templates/pki.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-root-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  isCA: true
  commonName: "Cluster Internal Root CA"
  secretName: internal-root-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 384
    # A CA renewed with a new key is a new CA: every certificate it signed
    # stops chaining. Keep the key across renewals.
    rotationPolicy: Never
  issuerRef:
    name: internal-ca-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io

---
# Source: cluster-pki/templates/pki.yaml
# Bootstrap only: signs the root and nothing else.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca-selfsigned
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  selfSigned: {}

---
# Source: cluster-pki/templates/pki.yaml
# What workloads use.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  ca:
    secretName: internal-root-ca
