---
# Source: cluster-pki/templates/pki.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-intermediate-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  isCA: true
  commonName: "Example Issuing CA"
  subject:
    organizations:
      - Example
  secretName: internal-intermediate-ca
  duration: 26280h
  renewBefore: 4380h
  privateKey:
    algorithm: RSA
    size: 4096
    # A CA renewed with a new key is a new CA: every certificate it signed
    # stops chaining. Keep the key across renewals.
    rotationPolicy: Never
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
      - example.com
      - svc.cluster.local
  issuerRef:
    name: example-ca-root
    kind: ClusterIssuer
    group: cert-manager.io

---
# Source: cluster-pki/templates/pki.yaml
# The root as an issuer, for the intermediate only.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: example-ca-root
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  ca:
    secretName: example-offline-root

---
# Source: cluster-pki/templates/pki.yaml
# What workloads use.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: example-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  ca:
    secretName: internal-intermediate-ca
