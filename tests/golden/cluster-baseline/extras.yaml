---
# Source: cluster-baseline/templates/resource-quota.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cluster-baseline
  namespace: example-app
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    cluster-baseline/quota-reason: caps a runaway batch job from starving the node pool
    helm.sh/resource-policy: keep
spec:
  hard:
    "count/jobs.batch": "1000000"
    "pods": "50"
    "requests.cpu": "20"
    "requests.memory": "64Gi"

---
# Source: cluster-baseline/templates/resource-quota.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cluster-baseline
  namespace: example-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    cluster-baseline/quota-owner: example-team
    helm.sh/resource-policy: keep
spec:
  hard:
    "requests.storage": "500Gi"

---
# Source: cluster-baseline/templates/limit-range.yaml
apiVersion: v1
kind: LimitRange
metadata:
  name: cluster-baseline
  namespace: example-app
  annotations:
    cluster-baseline/limit-range-reason: pods without sizing get a bounded default
spec:
  limits:
    - type: Container
      default:
        "memory": "512Mi"
      defaultRequest:
        "cpu": "100m"
        "memory": "128Mi"
      max:
        "memory": "4Gi"
