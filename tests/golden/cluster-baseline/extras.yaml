---
# Source: cluster-baseline/templates/network-policy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: example-default-deny
  namespace: example-app
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
spec:
  podSelector: {}
  policyTypes:
    - Egress
    - Ingress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: example-dns
          podSelector:
            matchLabels:
              app: "example-dns"
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

