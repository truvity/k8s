---
# Source: cluster-baseline/templates/guard.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-baseline-pod-security-labels
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: not-terminating
      expression: "!has(object.metadata.deletionTimestamp)"
    - name: not-excluded
      expression: "!(object.metadata.name in ['kube-system','kube-public','kube-node-lease','default'])"
  variables:
    - name: kinds
      expression: "['warn','audit','enforce']"
    - name: labelled
      expression: "has(object.metadata.labels) && variables.kinds.exists(k, 'pod-security.kubernetes.io/' + k in object.metadata.labels)"
    - name: wasLabelled
      expression: "request.operation == 'UPDATE' && has(oldObject.metadata.labels) && variables.kinds.exists(k, 'pod-security.kubernetes.io/' + k in oldObject.metadata.labels)"
  validations:
    # A create must carry a label. An update only has to keep the ones it had,
    # so a namespace that never had them is not nagged on every edit.
    - expression: "variables.labelled || (request.operation == 'UPDATE' && !variables.wasLabelled)"
      messageExpression: "'namespace ' + object.metadata.name + ' has no pod-security.kubernetes.io/warn|audit|enforce label; add one, or list the namespace in cluster-baseline'"

---
# Source: cluster-baseline/templates/guard.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cluster-baseline-pod-security-labels
spec:
  policyName: cluster-baseline-pod-security-labels
  validationActions: ["Warn","Audit"]
