---
# Source: eks-auto-node-pools/templates/node-classes.yaml
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: standard
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  role: example-node-role
  subnetSelectorTerms:
    - tags:
        example.com/subnet-tier: nodes
  securityGroupSelectorTerms:
    - tags:
        "aws:eks:cluster-name": example-cluster
  networkPolicy: DefaultDeny
  networkPolicyEventLogs: Disabled
  snatPolicy: Random
  ephemeralStorage:
    size: 80Gi
    iops: 3000
    throughput: 125

---
# Source: eks-auto-node-pools/templates/node-pools.yaml
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: standard
      expireAfter: 168h
      terminationGracePeriod: 1h0m0s
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["m"]
  disruption:
    # WhenEmpty reclaims empty nodes and never moves a live workload for
    # packing (recycling happens via expireAfter).
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
