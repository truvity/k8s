# Source: eks-auto-node-pools/templates/node-pools.yaml
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ci
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: ci
      expireAfter: 48h0m0s
      terminationGracePeriod: 2h0m0s
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["r"]
        - key: eks.amazonaws.com/instance-cpu
          operator: Lt
          values: ["5"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["zone-a"]
      taints:
        - key: ci
          value: "true"
          effect: NoSchedule
  limits:
    cpu: 224
  disruption:
    # WhenEmpty reclaims empty nodes and never moves a live workload for
    # packing (recycling happens via expireAfter).
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      # All empties at once. Underutilized and drift consolidation stay
      # serialized below: the storm guard is about moving LIVE pods, which an
      # empty node by definition has none of.
      - reasons: [Empty]
        nodes: "100%"
      - nodes: "1"

