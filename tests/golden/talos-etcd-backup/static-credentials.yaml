---
# Source: talos-etcd-backup/templates/service-accounts.yaml
# Talos API access: Talos answers this object with a Secret of the same name
# holding a talosconfig limited to the roles below.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-etcd-backup-talos
  namespace: default
spec:
  roles:
    - os:etcd:backup

---
# Source: talos-etcd-backup/templates/service-accounts.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-etcd-backup
  namespace: default
automountServiceAccountToken: false

---
# Source: talos-etcd-backup/templates/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-etcd-backup
  namespace: default
spec:
  schedule: "0 */6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: talos-etcd-backup
            app.kubernetes.io/instance: talos-etcd-backup
        spec:
          restartPolicy: Never
          serviceAccountName: talos-etcd-backup
          automountServiceAccountToken: false
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/control-plane
              operator: Exists
          containers:
            - name: talos-backup
              image: "ghcr.io/siderolabs/talos-backup:v0.1.0-beta.2"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              env:
                - {name: CLUSTER_NAME, value: "example"}
                - {name: BUCKET, value: "backups"}
                - {name: S3_PREFIX, value: "clusters/example/etcd"}
                - {name: AWS_REGION, value: "auto"}
                - {name: CUSTOM_S3_ENDPOINT, value: "https://s3.example.com"}
                # talos-backup v0.1.0-beta.2 turns path-style addressing ON
                # when USE_PATH_STYLE is "false" (pkg/config: == "false").
                - {name: USE_PATH_STYLE, value: "false"}
                - {name: AGE_X25519_PUBLIC_KEY, value: "age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"}
              envFrom:
                - secretRef:
                    name: backup-credentials
              volumeMounts:
                - {name: talos-secrets, mountPath: /var/run/secrets/talos.dev, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: talos-secrets
              secret:
                secretName: talos-etcd-backup-talos
            - name: tmp
              emptyDir: {}
