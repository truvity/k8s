# Source: tenancy/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-baseline
  namespace: ci-widgets
  labels:
    example.com/layer: tenancy
    example.com/tier: ci
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - podSelector: {}
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: db-operator
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: runners
    - from:
      - namespaceSelector:
          matchLabels:
            example.com/router: "true"
        podSelector:
          matchLabels:
            app.kubernetes.io/name: router
      - ipBlock:
          cidr: 10.0.0.0/22
      - ipBlock:
          cidr: 100.64.0.0/10
  egress:
    - to:
      - podSelector: {}
    - ports:
      - port: 4222
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: nats
        podSelector:
          matchLabels:
            app.kubernetes.io/name: nats
    - ports:
      - port: 443
        protocol: TCP
      to:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
          - 169.254.169.254/32
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - ipBlock:
          cidr: 172.20.0.0/16

