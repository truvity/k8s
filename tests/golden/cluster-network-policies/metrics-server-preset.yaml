---
# Source: cluster-network-policies/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router
  namespace: router
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: router
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - ipBlock:
          cidr: 100.64.0.0/10
  egress:
    - {}

---
# Source: cluster-network-policies/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-server
  namespace: metrics-server
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "15"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  policyTypes:
    - Egress
  egress:
    - ports:
      - port: 10250
        protocol: TCP
      - port: 443
        protocol: TCP
      to:
      - ipBlock:
          cidr: 10.0.0.0/16
      - ipBlock:
          cidr: 172.20.0.0/16
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            example.com/dns-forwarder: "true"
      - ipBlock:
          cidr: 172.20.0.0/16
      - ipBlock:
          cidr: 10.0.0.0/16
