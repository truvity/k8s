# A control for hack/conformance-admission.sh: a policy that does exceed the CEL
# cost budget (a cubic walk over the containers) and applies to one namespace
# only. The script proves the harness can see that failure: a pod with many
# containers is refused with "actual cost limit exceeded". If a Kubernetes
# release stops enforcing the budget this way, the control fails first and says
# so, instead of the allow-list check passing for the wrong reason.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: conformance-over-budget
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: iap-control}
    resourceRules:
      - {apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE"], resources: ["pods"]}
  validations:
    - expression: >-
        object.spec.containers.all(a, object.spec.containers.all(b, object.spec.containers.all(c,
          a.image.size() >= 0 && b.image.size() >= 0)))
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: conformance-over-budget
spec:
  policyName: conformance-over-budget
  validationActions: [Deny]
